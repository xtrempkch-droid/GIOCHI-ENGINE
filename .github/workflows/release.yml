name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compila e empacota sem criar a Release"
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TARGET: aarch64-unknown-linux-gnu

jobs:
  release:
    name: ARM64 release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ env.TARGET }}

      - name: Enable ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install cross
        run: cargo install cross --locked

      - name: Build ARM64 binary and examples
        run: |
          # Apenas o que é distribuído: biblioteca, binário e exemplos.
          # (Os testes são compilados no CI, não no release.)
          cross build --locked --release --target "$TARGET" --lib --bins --examples

      - name: Package artifacts
        run: |
          version="${GITHUB_REF_NAME:-manual}"
          bin_dir="target/$TARGET/release"
          stage="dist/giochi-engine-$version-$TARGET"
          mkdir -p "$stage/bin" "dist"

          cp "$bin_dir/giochi-demo" "$stage/bin/"
          for example in hello_rect moving_sprite input_test audio_test mini_game; do
            cp "$bin_dir/examples/$example" "$stage/bin/giochi-$example"
          done

          # O SDL2 `bundled` do cross é uma shared library ligada a backends de
          # desktop (sndio, wayland, jack, pipewire, pulse) que não existem em
          # imagens Buildroot. Ele não é distribuído: o alvo usa o SDL2 do
          # sistema (>= 2.26 com KMSDRM), como validado no R35S.

          cp LICENSE README.md CHANGELOG.md "$stage/"
          cp packaging/LEIA-ME.txt "$stage/LEIA-ME.txt"

          tar -czf "dist/giochi-engine-$version-$TARGET.tar.gz" \
            -C dist "giochi-engine-$version-$TARGET"

          rlib="$bin_dir/libgiochi_engine.rlib"
          if [ ! -f "$rlib" ]; then
            rlib="$(find "$bin_dir/deps" -maxdepth 1 -type f -name 'libgiochi_engine-*.rlib' -print -quit)"
          fi
          test -f "$rlib"
          tar -czf "dist/giochi-engine-lib-$version-$TARGET.tar.gz" \
            -C "$(dirname "$rlib")" "$(basename "$rlib")"

          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
          ls -lhR dist

      - name: Verify artifacts are AArch64
        run: |
          stage="dist/giochi-engine-${GITHUB_REF_NAME:-manual}-$TARGET"
          file "$stage/bin/giochi-demo" | grep -q "ARM aarch64"
          for binary in "$stage"/bin/*; do
            file "$binary" | grep -q "ARM aarch64"
          done
          test -x "$stage/bin/giochi-demo"
          if find "$stage" -type f -exec file {} + | grep -q "x86-64"; then
            echo "artefato contém binário x86_64"
            exit 1
          fi

      - name: Upload build preview
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: giochi-engine-${{ env.TARGET }}-preview
          path: dist/
          retention-days: 7

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
