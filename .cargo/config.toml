[build]
target = "x86_64-unknown-linux-gnu"

[env]
# O CMake 4 exige esse override ao configurar fontes SDL com políticas antigas.
CMAKE_POLICY_VERSION_MINIMUM = "3.5"

[target.aarch64-unknown-linux-gnu]
# Compilador cruzado usado nos builds locais contra o sysroot do dispositivo.
linker = "aarch64-linux-gnu-gcc"
